# XcodeGen-Spezifikation. Das .xcodeproj wird nicht eingecheckt, sondern
# lokal erzeugt: `xcodegen generate` (siehe docs/SETUP.md).
# Grund: ein generiertes Projekt erzeugt keine Merge-Konflikte in pbxproj.
name: BeerQuest

options:
  bundleIdPrefix: com.beerquest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  BeerQuestKit:
    path: BeerQuestKit

targets:
  BeerQuest:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beerquest.app
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/BeerQuest.entitlements
        TARGETED_DEVICE_FAMILY: "1"   # nur iPhone
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: BeerQuestKit
        product: BQCore
      - package: BeerQuestKit
        product: BQAPI
      - package: BeerQuestKit
        product: BQDesign
      - package: BeerQuestKit
        product: BQSession
      - package: BeerQuestKit
        product: BQCheckIn
      - package: BeerQuestKit
        product: BQWorld
      - package: BeerQuestKit
        product: BQPlay

schemes:
  BeerQuest:
    build:
      targets:
        BeerQuest: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: BeerQuestKit/BQCoreTests
