name: iOS build & tests

# Das Repository ist oeffentlich, damit sind GitHub-Standard-Runner
# unbegrenzt kostenlos - macOS eingeschlossen ("Free for Public, Paid for
# Private", docs.github.com). Die 0-Euro-Anforderung ist damit erfuellt,
# ohne Builds zu rationieren.
#
# Trotzdem sparsame Trigger: Dokumentationsaenderungen loesen keinen
# iOS-Build aus, und ein neuer Push bricht den laufenden ab.
on:
  push:
    paths: &code
      - "BeerQuestKit/**"
      - "App/**"
      - "project.yml"
      - "Config.xcconfig.example"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths: *code
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-latest = Apple Silicon, 3 Kerne, 7 GB. Fuer ein Projekt dieser
    # Groesse voellig ausreichend; Larger Runners waeren teurer und unnoetig.
    runs-on: macos-latest
    timeout-minutes: 20    # Notbremse gegen haengende Jobs

    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen

      - name: Konfiguration bereitstellen
        # Der Build braucht die Datei, aber keine echten Werte:
        # gebaut und getestet wird ohne Serverkontakt.
        run: cp Config.xcconfig.example Config.xcconfig

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Abhaengigkeiten zwischenspeichern
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('BeerQuestKit/Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Simulator waehlen
        id: sim
        # Fest verdrahtete Geraetenamen brechen, sobald GitHub das Image
        # aktualisiert. Deshalb den ersten verfuegbaren iPhone-Simulator nehmen.
        run: |
          NAME=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              print(next(x['name'] for v in d.values() for x in v if 'iPhone' in x['name']))")
          echo "Gewaehlt: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build und Tests
        run: |
          xcodebuild test \
            -project BeerQuest.xcodeproj \
            -scheme BeerQuest \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO
