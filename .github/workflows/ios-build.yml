name: iOS build & tests

# Das Repository ist oeffentlich, damit sind GitHub-Standard-Runner
# unbegrenzt kostenlos - macOS eingeschlossen ("Free for Public, Paid for
# Private", docs.github.com). Die 0-Euro-Anforderung ist damit erfuellt,
# ohne Builds zu rationieren.
#
# Trotzdem sparsame Trigger: Dokumentationsaenderungen loesen keinen
# iOS-Build aus, und ein neuer Push bricht den laufenden ab.
on:
  push:
    paths: &code
      - "BeerQuestKit/**"
      - "App/**"
      - "project.yml"
      - "Config.xcconfig.example"
      - ".github/workflows/ios-build.yml"
      # scripts/** gehoert dazu, obwohl dort kein Swift liegt: Der Lauf
      # ruft verify.sh auf. Eine Aenderung am Pruefskript, die den Build
      # bricht, waere sonst erst beim naechsten Swift-Commit aufgefallen -
      # und dann beim falschen Verdaechtigen.
      - "scripts/**"
  # KEIN Pfadfilter beim Pull Request - und das ist Absicht.
  # Ein Ablauf, der wegen eines Pfadfilters gar nicht erst startet, meldet
  # GitHub auch keinen Status. Als "required status check" im Branch-Schutz
  # bleibt er damit auf ewig ausstehend, und ein Pull Request, der nur
  # Dokumentation aendert, laesst sich nie mehr zusammenfuehren. Beim `push`
  # bleibt der Filter, denn dort kommen die meisten Laeufe her; ein Pull
  # Request ist selten genug, um ihn vollstaendig zu pruefen.
  pull_request:
  workflow_dispatch:

# **Der teure Auftrag reiht sich an, er wird nicht abgebrochen.**
# Uebernommen aus PulseMeter, wo genau die umgekehrte Einstellung an einem
# einzigen Tag drei Laeufe gekostet hat - jeden abgebrochen kurz vor dem
# App-Build, also nach der teuersten Minute und ohne je ein Ergebnis.
# Der billige Prototyp-Auftrag darf dagegen abgebrochen werden; er laeuft
# gleich wieder.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # macos-latest = Apple Silicon, 3 Kerne, 7 GB. Fuer ein Projekt dieser
    # Groesse voellig ausreichend; Larger Runners waeren teurer und unnoetig.
    runs-on: macos-latest
    timeout-minutes: 20    # Notbremse gegen haengende Jobs

    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen

      - name: Konfiguration bereitstellen
        # Der Build braucht die Datei, aber keine echten Werte:
        # gebaut und getestet wird ohne Serverkontakt.
        run: cp Config.xcconfig.example Config.xcconfig

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Abhaengigkeiten zwischenspeichern
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('BeerQuestKit/Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build und Tests
        # Dasselbe Skript, das auch lokal laeuft. Zwei Ablaeufe wuerden
        # auseinanderlaufen, und dann prueft die CI etwas anderes als der
        # Entwickler.
        run: ./scripts/verify.sh ios --streng
