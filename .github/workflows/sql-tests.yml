name: SQL tests

# Nur Linux-Runner. Keine macOS-CI: macOS kostet 0,062 $/min gegen 0,006 $/min
# und wuerde das Freikontingent von 2.000 Minuten auf ~200 zusammenschrumpfen.
# Der Xcode-Build laeuft lokal. Siehe docs/10-risks.md R16.
on:
  push:
    paths: ["supabase/**", ".github/workflows/sql-tests.yml"]
  pull_request:
    paths: ["supabase/**"]
  workflow_dispatch:

concurrency:
  group: sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Version wie im Supabase-Projekt (siehe supabase/config.toml).
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Migrationen, Seeds und Regeltests
        # Dasselbe Skript wie lokal. Es legt die Datenbank selbst an, macht
        # den Bootstrap, wendet die Migrationen zweimal an (Idempotenz),
        # spielt die Seeds ein und faehrt die Regeltests.
        run: ./supabase/ci/run_local.sh bq_ci
